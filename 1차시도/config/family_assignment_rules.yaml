# config/family_assignment_rules.yaml — v5.1 (Frozen Universe v4.2)
# Operational families F01..F29 + out-of-scope families F31..F34.
# NOTE: F30 intentionally unassigned (numbering buffer between op and out-of-scope).

family_assignment_rules:
  version: "v5.1"
  resolution_policy: "lower priority value wins; ties resolved by family_id ascending"
  notes:
    - "F30 is intentionally NOT assigned — reserved as a structural buffer between F29 (op) and F31 (out-of-scope)."
