        A3:
          state_in: [DOSE-DEFINED, DOSE-WEIGHT-BASED]
      required_policies:
        - delivery_anchor_policy
      examples: ["Pregnant subjects with delivery date used as elapsed-time anchor."]

    - family_id: F29
