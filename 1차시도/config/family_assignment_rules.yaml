    # ---- v4.2 NEW operational families ----

    - family_id: F24
      family_name: ADC_PK_PKPD
      operational_scope: true
      expected_terminal: REPAIR
      frequency_hint: MEDIUM
      v4_2_new: true
      priority: 4
      matching_axis_patterns:
        A0:
          modality_class: [ADC]
        A8:
          state_in: [MULTI-CMT-DEFINED, METABOLITE-DEFINED]
          analyte_role: [TOTAL_ANTIBODY, CONJUGATED_ADC, UNCONJUGATED_PAYLOAD, ACTIVE_METABOLITE]
      required_policies: [cmt_analyte_policy, analyte_role_declaration]
      exclusion_conditions:
        - "analyte_role missing"  # → Q16, not F24
      examples: ["ADC trial measuring total Ab + conjugated ADC + free payload."]
      notes: "v4.2 (C18, C22): requires analyte_role to avoid Q16."

    - family_id: F25
      family_name: Bispecific_TCellEngager_PKPD
      operational_scope: true
      expected_terminal: REPAIR
      frequency_hint: LOW_TO_MEDIUM
      v4_2_new: true
      priority: 4
      matching_axis_patterns:
        A0:
          modality_class: [BISPECIFIC]
        A8:
          state_in: [MULTI-CMT-DEFINED, METABOLITE-DEFINED]
          analyte_role: [PARENT, SOLUBLE_TARGET, DRUG_TARGET_COMPLEX]
      required_policies: [cmt_analyte_policy, analyte_role_declaration]
      examples: ["Bispecific T-cell engager with parent + soluble target + complex."]

    - family_id: F26
      family_name: CAR_T_Cellular_Kinetics
      operational_scope: true
      expected_terminal: REPAIR
      frequency_hint: LOW_TO_MEDIUM
      v4_2_new: true
      priority: 4
      matching_axis_patterns:
        A0:
          modality_class: [CELL_THERAPY]
          endpoint_data_type: [CELLULAR_KINETICS]
        A8:
          analyte_role: [VECTOR_COPY, CAR_POSITIVE_CELL, TRANSGENE_EXPRESSION]
        A7:
          state_in: [PRODUCT-LEVEL-COVARIATE, BASELINE-CLEAN, TIME-VARYING]
      required_policies:
        - cellular_LLOQ_derivation_policy
        - lot_subject_linkage_key
      exclusion_conditions:
        - "A8=CMT-POLICY-MISSING"
        - "endpoint_data_type=CELLULAR_KINETICS AND cellular_LLOQ_derivation_policy absent"
      examples: ["CAR-T cellular kinetics with vector copy + CAR+ cell count, lot-level transduction efficiency joined."]
      notes: "v4.2 (C23): replaces silent CONTINUOUS_PD path that caused false REPAIR in v4.1."

    - family_id: F27
      family_name: mRNA_vaccine_like
      operational_scope: true
      expected_terminal: REPAIR
      frequency_hint: LOW
      v4_2_new: true
      priority: 5
      matching_axis_patterns:
        A0:
          modality_class: [MRNA, VACCINE]
          endpoint_data_type: [IMMUNOGENICITY, CONTINUOUS_PD]
      required_policies:
        - positivity_adjudication_rule
        - dose_reconstruction_policy
      examples: ["mRNA vaccine prime/boost; immunogenicity + dose form."]

