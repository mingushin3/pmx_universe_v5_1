      required_policies:
        - dyad_linkage_policy
        - delivery_anchor_policy
        - milk_matrix_lloq_policy   # only when MILK_PK
      exclusion_conditions:
        - "A1=ID-DYAD-UNLINKED-POLICY-MISSING"  # → Q18
      examples: ["Lactation study; mother + infant PK linked via MOTHER_SUBJID column on infant rows; milk LLOQ declared."]
      notes: "v4.2 (C21): F29 supports dyad linkage; absence of policy goes to Q18, never INVALID."

